workflows:
  ios-debug:
    name: Lody iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.13.0
      ruby: 3.3.0
      vars:
        EXPO_NO_DOCTOR: "1"
    scripts:
      - name: Install pnpm
        script: |
          npm install --global pnpm@11.10.0 --force
          pnpm --version
      - name: Install JavaScript dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Generate native assets and iOS project
        script: |
          cd apps/mobile
          pnpm native:assets
          npx expo prebuild --platform ios --no-install
      - name: Install Ruby gems and CocoaPods dependencies
        script: |
          cd apps/mobile
          bundle install
          cd ios
          bundle exec pod install --repo-update
      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          cd apps/mobile/ios

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Available schemes:"
          xcodebuild -workspace "$WORKSPACE" -list

          SCHEME="Lody"
          BUILD_DIR="$CM_BUILD_DIR/build/iphoneos"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "Searching for built app..."
          find "$BUILD_DIR/Build/Products" -maxdepth 3 -name "*.app" -print

          APP_PATH=$(find "$BUILD_DIR/Build/Products" -type d -name "Lody.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR/Build/Products" -type d -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No iPhoneOS .app found"
            exit 1
          fi

          echo "Using app: $APP_PATH"
          rm -rf "$CM_BUILD_DIR/ipa"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          /usr/bin/zip -qry "$CM_BUILD_DIR/Lody-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/Lody-unsigned.ipa"
    artifacts:
      - $CM_BUILD_DIR/Lody-unsigned.ipa
      - $CM_BUILD_DIR/build/iphoneos/Build/Products/Release-iphoneos/*.app
